<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Inventory Hub</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.card{
    border:1px solid #d0d0d0;
    border-radius:10px;
    padding:20px;
}

h1{
    color:#1f4e79;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Audit Inventory Hub</h1>

<div class="card">

<h3>Generador HandHeld</h3>

<p>Seleccione el archivo de existencias CSV:</p>

<input type="file" id="archivoCsv" accept=".csv">

<br>

<button onclick="procesarArchivo()">
Procesar Archivo
</button>

<div id="resultado"></div>

</div>

<script>

function procesarArchivo(){

    const archivo =
        document.getElementById("archivoCsv").files[0];

    if(!archivo){
        alert("Seleccione un archivo CSV");
        return;
    }

    document.getElementById("resultado").innerHTML =
        "Archivo seleccionado:<br><b>" +
        archivo.name +
        "</b><br><br>Versión 1.0 lista para procesar.";

}

</script>

</body>
</html>
