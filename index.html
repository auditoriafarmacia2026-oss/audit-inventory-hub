<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inventory Validation Center</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:40px auto;
    padding:20px;
    background:#f5f7fa;
}

.card{
    background:white;
    border:1px solid #d9d9d9;
    border-radius:10px;
    padding:25px;
}

h1{
    color:#1f4e79;
}

button{
    padding:10px 20px;
    margin-top:10px;
    margin-right:10px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
    line-height:1.8;
}

#farmaciaDetectada{
    margin-top:15px;
    font-weight:bold;
    color:#1f4e79;
}

</style>

</head>

<body>

<h1>Inventory Validation Center</h1>

<div class="card">

<h2>Generador de Archivos Inventario</h2>

<input
type="file"
id="archivoCsv"
accept=".csv">

<br><br>

<button onclick="procesarArchivo()">
Procesar Archivo
</button>

<div id="farmaciaDetectada"></div>

<div id="resultado"></div>

</div>

<script>

function procesarArchivo(){

    const archivo =
        document.getElementById("archivoCsv").files[0];

    if(!archivo){

        alert("Seleccione un archivo CSV");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const texto =
            e.target.result;

        const lineas =
            texto.split(/\r?\n/);

        let encabezado = -1;

        for(let i=0;i<lineas.length;i++){

            if(lineas[i].includes("Articulo_Id")){

                encabezado = i;
                break;
            }
        }

        if(encabezado === -1){

            document.getElementById("resultado")
            .innerHTML =
            "No se encontró la columna Articulo_Id";

            return;
        }

        let farmaciaCodigo =
            "DESCONOCIDA";

let total = 0;
let padres = 0;
let hijos = 0;
let negativos = 0;
let omitidos = 0;

let handheldData = [];
let hijosData = [];
let negativosData = [];

        for(let i=encabezado+1;i<lineas.length;i++){

            const fila =
                lineas[i].split(",");

            if(fila.length < 6){
                continue;
            }

            if(
                farmaciaCodigo === "DESCONOCIDA"
            ){

                const sucId =
                    fila[0] || "";

                const match =
                    sucId.match(/K\d{3}/);

                if(match){

                    farmaciaCodigo =
                        match[0];
                }

            }

            const sku =
                (fila[3] || "").trim();

            const descripcion =
                (fila[4] || "").trim();

            const existencia =
                parseFloat(fila[5] || 0);

            if(!sku){
                continue;
            }

            total++;

            if(existencia === 0){

    console.log(
        "OMITIDO:",
        sku,
        descripcion,
        fila[5]
    );

    omitidos++;

            }else if(existencia < 0){

    negativos++;

    negativosData.push([
        sku,
        descripcion,
        existencia
    ]);

            }else if(
    sku.endsWith("H")
){

    hijos++;

    hijosData.push([
        sku,
        descripcion,
        existencia
    ]);

            }else{

    padres++;

    handheldData.push([
        sku,
        descripcion,
        existencia
    ]);
}

        }

        document.getElementById(
            "farmaciaDetectada"
        ).innerHTML =

        "Farmacia detectada: " +
        farmaciaCodigo;

        document.getElementById(
            "resultado"
        ).innerHTML =

        "<h3>Resultado</h3>" +

        "SKU Totales: <b>" +
        total +
        "</b><br>" +

        "SKU Padres: <b>" +
        padres +
        "</b><br>" +

        "SKU Hijos: <b>" +
        hijos +
        "</b><br>" +

        "SKU Negativos: <b>" +
        negativos +
        "</b><br>" +

        "SKU Omitidos (0): <b>" +
        omitidos +
        "</b><br><br>" +

        "<button id='btnHandheld'>Descargar HANDHELD.csv</button>" +

        "<button id='btnHijos'>Descargar HIJOS.csv</button>" +

        "<button id='btnNegativos'>Descargar NEGATIVOS.csv</button>";
        
        setTimeout(function(){

    document.getElementById(
        "btnHandheld"
    ).onclick = function(){

        let csv =
            "Articulo_Id,Textbox6,Existencia\n";

        handheldData.forEach(function(item){

            csv +=
                item[0] + "," +
                item[1] + "," +
                item[2] + "\n";

        });

        const blob =
            new Blob(
                [csv],
                {type:"text/csv"}
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "HANDHELD_" +
            farmaciaCodigo +
            ".csv";

        a.click();

        URL.revokeObjectURL(url);

    };

    document.getElementById(
        "btnHijos"
    ).onclick = function(){

        let csv =
            "Articulo_Id,Textbox6,Existencia\n";

        hijosData.forEach(function(item){

            csv +=
                item[0] + "," +
                item[1] + "," +
                item[2] + "\n";

        });

        const blob =
            new Blob(
                [csv],
                {type:"text/csv"}
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "HIJOS_" +
            farmaciaCodigo +
            ".csv";

        a.click();

        URL.revokeObjectURL(url);

    };

    document.getElementById(
        "btnNegativos"
    ).onclick = function(){

        let csv =
            "Articulo_Id,Textbox6,Existencia\n";

        negativosData.forEach(function(item){

            csv +=
                item[0] + "," +
                item[1] + "," +
                item[2] + "\n";

        });

        const blob =
            new Blob(
                [csv],
                {type:"text/csv"}
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "NEGATIVOS_" +
            farmaciaCodigo +
            ".csv";

        a.click();

        URL.revokeObjectURL(url);

    };

},100);

    };

    reader.readAsText(archivo);

}

</script>

<script src="app.js"></script>

</body>
</html>
